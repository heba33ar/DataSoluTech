services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mdb-data:/data/db
    networks:
      - healthcare_network
  healthcare:
    build: .
    container_name: healthcare
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      - MDB_URI=mongodb://mongodb:27017/
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
    volumes:
      - kagglehub-cache:/root/.cache/kagglehub
    networks:
      - healthcare_network


volumes:
  mdb-data:
  kagglehub-cache:

#the two services reach each other by service name over this network, which is
#what makes MDB_URI=mongodb://mongodb:27017/ resolve
networks:
  healthcare_network:
    driver: bridge
    name: healthcare_net

