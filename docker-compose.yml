services:
  #the database, the only service that keeps running
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    #creating the root account is what starts MongoDB with authentication
    #only done when the mdb-data volume is empty
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - mdb-data:/data/db
    networks:
      - healthcare_network

  #step 1: check the source data, no database needed
  unit_tests:
    build: .
    profiles:
      - pipeline
    volumes:
      - kagglehub-cache:/root/.cache/kagglehub
    networks:
      - healthcare_network
    command: ["pytest", "df_integrity_test.py", "-q"]

  #step 2: migrate into MongoDB, only if step 1 succeeded
  migrate:
    build: .
    profiles:
      - pipeline
    depends_on:
      mongodb:
        condition: service_healthy
      unit_tests:
        condition: service_completed_successfully
    environment:
      #mongodb is the service name, Docker resolves it on the network below
      - MONGO_HOST=mongodb:27017
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:-}
      - KAGGLE_USERNAME=${KAGGLE_USERNAME:-}
      - KAGGLE_KEY=${KAGGLE_KEY:-}
    volumes:
      - kagglehub-cache:/root/.cache/kagglehub
    networks:
      - healthcare_network
    command: ["python", "healthcare.py"]

  #step 3: check what landed in MongoDB
  integrity_tests:
    build: .
    profiles:
      - pipeline
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      - MONGO_HOST=mongodb:27017
      - MONGO_ROOT_USERNAME=${MONGO_ROOT_USERNAME}
      - MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
    volumes:
      - kagglehub-cache:/root/.cache/kagglehub
    networks:
      - healthcare_network
    command: ["pytest", "collection_integrity_test.py", "-q"]

volumes:
  mdb-data:
  #keeps the Kaggle download, so it is only made once
  kagglehub-cache:

#lets the containers reach each other by service name
networks:
  healthcare_network:
    driver: bridge
    name: healthcare_net
